name: Grimoire
options:
  bundleIdPrefix: com.nicholai
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GrimoireUI:
    path: ../UI
targets:
  Grimoire:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: GrimoireUI
    # The hub is reached by tailnet IP over plain HTTP (the tunnel is encrypted); App Transport Security would refuse that.
    info:
      path: Mac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.grimoire
        PRODUCT_NAME: Grimoire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grimoire
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  GrimoireiOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: GrimoireUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.grimoire.ios
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Grimoire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grimoire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the time-of-day icons: dawn, day and dusk; night is the primary AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconDawn AppIconDay AppIconDusk"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
